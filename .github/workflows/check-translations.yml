name: Check translations

on:
  pull_request:
    paths:
      - "Translations/**"
      - "tools/check-translations.py"
  push:
    branches: [main]
    paths:
      - "Translations/**"
      - "tools/check-translations.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate published strings.csv files
        run: python tools/check-translations.py
