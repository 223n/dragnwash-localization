name: Check translations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate published strings.csv files
        id: validate
        run: |
          set +e
          python tools/check-translations.py | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Save the report for the comment workflow
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ steps.validate.outputs.status }}" > status.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: check-report
          path: |
            report.txt
            pr-number.txt
            status.txt
      - name: Compare every file with the fingerprints of real game installs
        run: python tools/check-game-files.py
      - name: Line keys match the vectors (tools/linekeys.py, same as the framework's)
        run: python tools/linekeys.py --check
      - name: Fail if the check found problems
        if: steps.validate.outputs.status != '0'
        run: exit 1
