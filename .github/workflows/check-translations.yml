name: Check translations

on:
  pull_request:
  push:
    branches: [main]

# Only the checkout needs anything. A pull request from a fork gets a
# read-only token regardless, but a push to main would otherwise run with
# the repository default.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate published strings.csv files
        id: validate
        run: |
          set +e
          python tools/check-translations.py | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # No pull request number here on purpose: a fork controls this file on
      # its own head, so the comment workflow must not learn the number from
      # the artifact. It resolves it from the workflow_run head SHA instead.
      - name: Save the report for the comment workflow
        if: github.event_name == 'pull_request'
        run: echo "${{ steps.validate.outputs.status }}" > status.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: check-report
          path: |
            report.txt
            status.txt
      - name: Compare every file with the fingerprints of real game installs
        run: python tools/check-game-files.py
      - name: Line keys match the vectors (tools/linekeys.py, same as the framework's)
        run: python tools/linekeys.py --check
      - name: Fail if the check found problems
        if: steps.validate.outputs.status != '0'
        run: exit 1
