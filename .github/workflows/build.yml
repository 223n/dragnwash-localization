name: Build

# Builds the release zip on GitHub instead of on a maintainer's machine.
#
# The plugin compiles against the game's own assemblies, which this public
# repository must never contain. They live in the private repository
# TomXV/dragnwash-libs and are fetched with LIBS_TOKEN, a fine-grained token
# with read access to that repository only, kept as an Actions secret.
# This workflow runs only on pushes to main or dev, on tags and by hand, never
# for pull requests, so a fork can never reach the token.
# In a fork the job is skipped: the fork has no LIBS_TOKEN, and a push to
# its main would otherwise end in a failed run.
#
# The mod is built against one published Drag'n Wash ModFramework release, the
# version in framework-version.txt, never against a branch. Its zip is taken
# from that release only when the release's SHA256SUMS, the digest GitHub keeps
# for the asset and the hash computed here agree. The mod's zip does not carry
# the framework: its mod-install.json names that release, and the installers
# fetch it.
#
# After the build, the unit tests in tests/ run too.
#
# Every run uploads release/DragNWashLocalization-<version>.zip as a workflow
# artifact. A v* tag also creates a DRAFT GitHub release with the zip attached;
# publishing it stays a person's decision.
#
# When a run fails, the reason is in the run's annotations (the red lines at
# the top of the summary page) and in the job summary; each step below says
# what to do about the failure it can see.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    if: github.repository == 'TomXV/dragnwash-localization'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the LIBS_TOKEN secret exists
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.LIBS_TOKEN != '' }}
        run: |
          if ($env:HAS_TOKEN -ne 'true') {
            Write-Host "::error title=LIBS_TOKEN is not set::The Build workflow needs the LIBS_TOKEN secret to read the private TomXV/dragnwash-libs repository. Add it under Settings > Secrets and variables > Actions > New repository secret, with a fine-grained personal access token that has Contents: Read-only on dragnwash-libs only."
            "### Build failed: LIBS_TOKEN is not set`n`nAdd the secret under **Settings > Secrets and variables > Actions** (name ``LIBS_TOKEN``, a fine-grained token with *Contents: Read-only* on ``TomXV/dragnwash-libs``). A token that expired fails the reference-assemblies step instead, with a 'repository not found' message." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Write-Host "LIBS_TOKEN is set."

      - name: Get the pinned Drag'n Wash ModFramework release
        id: framework
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Three hashes of the one zip must agree: the release's SHA256SUMS, the
          # asset digest GitHub computed when it was uploaded, and this download's.
          # A mismatch means the asset changed after it was published, or the
          # download is damaged; either way it is not used.
          function Fail([string]$title, [string]$message) {
            Write-Host "::error title=$title::$message"
            "### Build failed: $title`n`n$message" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          $version = (Get-Content -Raw framework-version.txt).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Fail 'framework-version.txt is not a version' "It says '$version'. Put the one framework release this mod is built against in it, like 1.4.3."
          }
          $repo = 'TomXV/dragnwash-modframework'
          $name = "DragNWash.ModFramework-$version.zip"

          $json = gh api "repos/$repo/releases/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            Fail "ModFramework v$version is not published" "framework-version.txt pins $version, but $repo has no published release v$version (a draft cannot be downloaded). Publish that framework release first, or pin a published one."
          }
          $release = $json | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq $name }
          if (-not $asset) {
            Fail "ModFramework v$version has no $name" "The release v$version of $repo does not carry $name. Pin a framework release that does."
          }
          if (-not ($release.assets | Where-Object { $_.name -eq 'SHA256SUMS' })) {
            Fail "ModFramework v$version has no SHA256SUMS" "The release v$version of $repo carries no SHA256SUMS, so its zip cannot be checked. Pin a framework release that carries SHA256SUMS (framework-version.txt)."
          }
          if ("$($asset.digest)" -notmatch '^sha256:([0-9a-f]{64})$') {
            Fail "No digest for $name" "GitHub reports no SHA-256 digest for $name in v$version ('$($asset.digest)'). Pin a framework release whose assets were uploaded with a digest."
          }
          $digest = $Matches[1]

          New-Item -ItemType Directory -Force .framework | Out-Null
          gh release download "v$version" -R $repo -p $name -p SHA256SUMS -D .framework
          if ($LASTEXITCODE -ne 0) {
            Fail "ModFramework v$version could not be downloaded" "gh release download failed for $name and SHA256SUMS from $repo v$version. Re-run the job; if it fails again, check that the release is still published."
          }
          $zip = (Resolve-Path ".framework/$name").Path
          $local = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $listed = @(Get-Content .framework/SHA256SUMS |
            Where-Object { $_ -match '^([0-9a-fA-F]{64}) [ *](.+)$' -and $Matches[2].Trim() -eq $name } |
            ForEach-Object { ($_ -split ' ')[0].ToLowerInvariant() } |
            Sort-Object -Unique)
          if ($listed.Count -ne 1) {
            Fail "SHA256SUMS does not list $name" "SHA256SUMS in $repo v$version should list $name once, with one hash; it has $($listed.Count). Pin a framework release whose SHA256SUMS lists its zip."
          }
          if ($local -ne $listed[0] -or $local -ne $digest -or (Get-Item $zip).Length -ne $asset.size) {
            Fail "ModFramework v$version does not match its hashes" "$name was not used: downloaded $local ($((Get-Item $zip).Length) bytes), SHA256SUMS $($listed[0]), GitHub digest $digest ($($asset.size) bytes). A published release must never change its assets; re-run once, and if they still differ, find out what changed in $repo v$version before building."
          }
          Write-Host "$name`: SHA256SUMS, the GitHub digest and this download agree ($local)."
          "zip=$zip" | Out-File -Append $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          "sha256=$local" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Get the reference assemblies (private, never committed here)
        uses: actions/checkout@v7
        with:
          repository: TomXV/dragnwash-libs
          token: ${{ secrets.LIBS_TOKEN }}
          path: .libs-private

      - name: Put them where the project expects them
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/DragNWashLocalization/libs | Out-Null
          Copy-Item .libs-private/localization/*.dll src/DragNWashLocalization/libs/
          Remove-Item -Recurse -Force .libs-private
          (Get-ChildItem src/DragNWashLocalization/libs).Count

      - name: Check that every referenced assembly is there
        shell: pwsh
        run: |
          # Every <HintPath>libs\X.dll</HintPath> in this project must exist after the
          # copy above. The DragNWash.ModFramework*.dll ones are not in dragnwash-libs:
          # pack.ps1 takes them from the framework release above and checks them itself.
          $missing = @()
          foreach ($csproj in Get-ChildItem src/DragNWashLocalization/*.csproj) {
            $text = Get-Content -Raw $csproj
            foreach ($m in [regex]::Matches($text, 'libs[\\/]([A-Za-z0-9.]+\.dll)')) {
              $dll = $m.Groups[1].Value
              if ($dll -like 'DragNWash.ModFramework*') { continue }
              if (-not (Test-Path "src/DragNWashLocalization/libs/$dll")) {
                $missing += "$dll in dragnwash-libs/localization (referenced by $($csproj.Name))"
              }
            }
          }
          $missing = $missing | Sort-Object -Unique
          if ($missing) {
            foreach ($m in $missing) { Write-Host "::error title=Reference assembly missing::$m. Copy it there from a game install and push that repository." }
            "### Build failed: reference assemblies missing from dragnwash-libs`n`n" + (($missing | ForEach-Object { "- ``$_``" }) -join "`n") | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Write-Host "All referenced assemblies are present."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build and pack (against the pinned framework release)
        shell: pwsh
        env:
          FRAMEWORK_ZIP: ${{ steps.framework.outputs.zip }}
          FRAMEWORK_VERSION: ${{ steps.framework.outputs.version }}
          FRAMEWORK_SHA256: ${{ steps.framework.outputs.sha256 }}
        run: |
          # Compiler errors are annotated by the .NET problem matcher; pack.ps1's own
          # checks throw with a reason, which is turned into an annotation here.
          try {
            pwsh tools/pack.ps1 -FrameworkZip $env:FRAMEWORK_ZIP
            if ($LASTEXITCODE -ne 0) { throw "tools/pack.ps1 exited with $LASTEXITCODE (see the lines above for the build error)." }
          } catch {
            Write-Host "::error title=Build and pack failed::$($_.Exception.Message)"
            "### Build failed`n`n$($_.Exception.Message)`n`nCompiler errors, if any, are listed as annotations on this run. A missing-member error, or 'too old for this mod', means the pinned framework release (framework-version.txt, ``$env:FRAMEWORK_VERSION``) is older than what this mod needs: pin a newer published release." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          "### Built ``$($zip.Name)`` ($([math]::Round($zip.Length / 1KB)) KB) from ``$env:GITHUB_REF_NAME`` at ``$($env:GITHUB_SHA.Substring(0, 7))``, against Drag'n Wash ModFramework ``$env:FRAMEWORK_VERSION`` (the published release, sha256 ``$env:FRAMEWORK_SHA256``)" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Unit tests
        shell: pwsh
        run: |
          # The tests compile the plugin's own source files and need
          # DragNWash.ModFramework.Dialogue.dll in libs/, which the pack step above
          # took from the pinned framework release.
          dotnet test tests/DragNWashLocalization.Tests
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Unit tests failed::dotnet test exited with $LASTEXITCODE. The failing tests are listed in this step's log."
            "### Unit tests failed`n`nThe failing tests are in this step's log. Run them locally with ``dotnet test tests/DragNWashLocalization.Tests``." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: DragNWashLocalization
          path: release/*.zip
          if-no-files-found: error

      - name: Draft a release for the tag (a person publishes it)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem release/*.zip | Select-Object -First 1).FullName
          gh release create $tag $zip --draft --title $tag --notes "Draft made by the Build workflow. Replace these notes before publishing."
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Draft release not created::gh release create failed for $tag. A release for this tag may already exist (delete the draft and re-run), or the workflow token lacks contents: write."
            exit 1
          }
          "Draft release **$tag** created with ``$(Split-Path -Leaf $zip)``; publish it by hand." | Out-File -Append $env:GITHUB_STEP_SUMMARY
